<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Pixel Background</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    html, body {
      overflow: hidden;
      height: 100%;
      margin: 0;
      padding: 0;
    }
    
    body {
      background: url('Sky.jpg') center center;
      background-size: cover;
      font-family: 'Poppins', sans-serif;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .overlay {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.15);
      padding: 2rem 3rem;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      z-index: 1000;
      text-align: center;
      min-width: 280px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .overlay:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .title {
      color: white;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      margin: 0 0 1.5rem 0;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.5px;
      position: relative;
      display: inline-block;
    }

    .title::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 50px;
      height: 2px;
      background: rgba(255, 255, 255, 0.7);
      border-radius: 3px;
    }

    .creation-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    .creation-list li {
      margin: 1.1rem 0;
    }

    .creation-list a {
      text-decoration: none;
      color: rgba(255, 255, 255, 0.9);
      font-size: 1.1rem;
      font-weight: 400;
      transition: all 0.3s ease;
      display: inline-block;
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      position: relative;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }

    .creation-list a:hover {
      color: white;
      background-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    .creation-list a::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.7);
      transition: width 0.3s ease;
    }

    .creation-list a:hover::before {
      width: 60%;
    }
  </style>
</head>

<body>
  <!-- Overlay Box -->
  <div class="overlay">
    <h1 class="title">Beyond The Dreams</h1>
    <ul class="creation-list">
      <li><a href="/Stars">Stars</a></li>
      <li><a href="/Peace">Peace</a></li>
      <li><a href="/Card">Card</a></li>
      <li><a href="/Music">Music</a></li>
      <li><a href="/Truth">Truth</a></li>
      <li><a href="/Gallery">Gallery</a></li>
    </ul>
  </div>

  <script>
    (function() {
      var squares = [];
      var canvas = null;
      var lastFrame = new Date().getTime();
      var delta = 0;
      var mousePos = null;
      var debug = true;
      var click = false;
      var properties = {
        cols: 64,
        rows: 32,
        color: "#ffffff",
        altColor: "#1564a1",
        sLength: 0,
        activeAmt: 0.25,
        easeIn: 0.25
      };

      var init = function() {
        canvas = document.createElement('canvas');
        document.body.appendChild(canvas);

        canvas.width = canvas.offsetWidth;
        canvas.height = (canvas.offsetWidth / properties.cols * properties.rows);
        properties.sLength = canvas.offsetWidth / properties.cols;
        
        // Generate the Grid
        for (var r = 0; r < properties.rows; r++) {
          squares[r] = [];
          for (var c = 0; c < properties.cols; c++) {
            squares[r][c] = null;
          }
        }

        canvas.addEventListener('mousemove', function(evt) {
          mousePos = getMousePos(evt);
        });

        canvas.addEventListener('mouseout', function(evt) {
          mousePos = null;
        });
        
        canvas.addEventListener('mousedown', function(evt){
          mousePos = getMousePos(evt);
          click = true;
        });
      }

      var step = function() {
        delta = (new Date().getTime() - lastFrame) / 1000;
        lastFrame = new Date().getTime();

        // Spawn new Squares
        for (var i = 0; i < Math.ceil(properties.cols * delta); i++) {
          var c = Math.round(Math.random() * (properties.cols - 1));
          var r = Math.round(Math.random() * (properties.rows - 1));
          if (squares[r][c] == null) {
            var duration = Math.round(5 * (Math.random() + 0.5));
            squares[r][c] = new Square(c, r, duration);
          }
        }
        
        // Spawn squares under the mouse
        if (mousePos != null) {
          var col = Math.round((mousePos.x - properties.sLength / 2) / canvas.width * properties.cols);
          var row = Math.round((mousePos.y - properties.sLength / 2) / canvas.height * properties.rows);
          
          if(click){
            squares[row][col] = new Square(col, row, 5, false, "#f00");
            click = false;
          } else if(squares[row][col]) {
            squares[row][col].reset();
          } else {
            squares[row][col] = new Square(col, row, 10, false)
          }
        }

        // Remove old squares
        for (var r = 0; r < properties.rows; r++) {
          for (var c = 0; c < properties.cols; c++) {
            if (squares[r][c] != null && squares[r][c].life <= 0) {
              squares[r][c] = null;
            }
          }
        }

        render();

        requestAnimationFrame(step);
      }

      var render = function() {
        var ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var r = 0; r < properties.rows; r++) {
          for (var c = 0; c < properties.cols; c++) {
            if (squares[r][c] != null) {
              squares[r][c].step(ctx);
            }
          }
        }
      }

      function getMousePos(evt) {
        var rect = canvas.getBoundingClientRect();

        return {
          x: evt.clientX - rect.left,
          y: evt.clientY - rect.top
        };
      }

      init();
      requestAnimationFrame(step);

      // Helper Function
      var getActiveNum = function() {
        var i = 0;
        for (var r = 0; r < properties.rows; r++) {
          for (var c = 0; c < properties.cols; c++) {
            if (squares[r][c] != null) {
              i++;
            }
          }
        }
        return i;
      }

      var Square = function(c, r, life, animIn, color) {
        
        if(typeof(animIn) == "undefined"){
          animIn = true;
          opacity = 0;
        } else {
          animIn = false;
          opacity = 1;
        }
        
        this.col = c;
        this.row = r;
        this.life = life;
        this.color = color ? color : properties.color;
        this.initialLife = life;
        this.animIn = animIn;
        this.opacity = opacity;

        this.step = function(ctx) {
          this.render(ctx);
          if (this.animIn) { //this.animIn){
            this.opacity = this.opacity +  (1 / properties.easeIn * delta);
            if (this.opacity >= 1) {
              this.opacity = 1;
              this.animIn = false;
            }
          } else {
            this.life = this.life - delta;
            if (this.life < 0) {
              this.life = 0;
            }
            this.opacity = Math.round(1 * (this.life / this.initialLife) * 1000) / 1000;
          }
        };

        this.render = function(ctx) {
          var l = properties.sLength;
          ctx.globalAlpha = this.opacity;
          ctx.fillStyle =  this.color;
          ctx.fillRect(this.col * l, this.row * l, l, l);

          if (debug == true) {
            ctx.globalAlpha = 1;
            ctx.fillStyle = "#000";
            ctx.font = "12px Arial";
          }
        };
        
        this.reset = function(){
          this.opacity = 1;
          this.life = this.initialLife;
        };
      }
    })();
  </script>
</body>
</html>
